<body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Viewer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0d;
  color:#eee;
  font-family:Arial,sans-serif;
}

/* MAIN */

.wrap{
  max-width:1100px;
  margin:35px auto;
  padding:0 16px;
}

h2{
  margin:0 0 18px;
  font-size:22px;
}

/* CONTROLS */

.controls{
  background:#151518;
  border:1px solid #29292e;
  border-radius:12px;
  padding:12px;
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.type{
  display:flex;
  background:#0d0d0f;
  border-radius:8px;
  padding:3px;
}

.type button{
  border:0;
  background:transparent;
  color:#999;
  padding:9px 16px;
  border-radius:6px;
  cursor:pointer;
}

.type button.active{
  background:#29292e;
  color:#fff;
}

input{
  flex:1;
  min-width:200px;

  background:#0d0d0f;
  color:#fff;

  border:1px solid #303035;
  border-radius:8px;

  padding:10px 12px;
  outline:none;
}

input:focus{
  border-color:#555;
}

.fetch{
  border:0;
  background:#fff;
  color:#111;

  padding:10px 22px;
  border-radius:8px;

  cursor:pointer;
  font-weight:600;
}

.status{
  margin:14px 2px;
  color:#888;
  font-size:13px;
}

/* PHOTO GRID */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}

.photo{
  aspect-ratio:1/1;

  background:#111114;
  border:1px solid #252529;
  border-radius:9px;

  overflow:hidden;
  cursor:pointer;
}

.photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  background:#101012;

  transition:transform .2s ease;
}

.photo:hover img{
  transform:scale(1.03);
}

/* =================================
   FULLSCREEN PREVIEW
================================= */

.preview{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:#000;

  z-index:100;

  /*
    Space for close + navigation buttons
  */
  padding:45px 55px;

  touch-action:none;
}

.preview.show{
  display:flex;
}


/*
  IMPORTANT:

  Image box poori available screen
  width + height use karega.
*/

.imageBox{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/*
  Small image bhi available screen
  ke according enlarge hogi.

  Aspect ratio maintain rahega.
  Stretch/crop nahi hoga.
*/

.imageBox img{
  width:100%;
  height:100%;

  object-fit:contain;

  display:block;

  user-select:none;
  -webkit-user-drag:none;
}


/* PREVIEW BUTTONS */

.close,
.nav{
  position:absolute;

  width:44px;
  height:44px;

  border:0;
  border-radius:50%;

  background:#ffffff18;
  color:#fff;

  cursor:pointer;

  z-index:5;

  backdrop-filter:blur(8px);

  transition:
    background .15s ease,
    transform .15s ease;
}

.close{
  top:15px;
  right:15px;

  font-size:26px;
  line-height:44px;
}

.nav{
  top:50%;
  transform:translateY(-50%);

  font-size:30px;
  line-height:44px;
}

.prev{
  left:12px;
}

.next{
  right:12px;
}

.close:hover,
.nav:hover{
  background:#ffffff30;
}

.nav:active{
  transform:translateY(-50%) scale(.94);
}

.close:active{
  transform:scale(.94);
}


/* PHOTO COUNT */

.count{
  position:absolute;

  bottom:15px;
  left:50%;

  transform:translateX(-50%);

  padding:6px 11px;

  border-radius:20px;

  background:#111c;
  color:#aaa;

  font-size:13px;

  z-index:5;
}


/* =================================
   MOBILE
================================= */

@media(max-width:600px){

  .wrap{
    margin:20px auto;
  }

  .controls{
    display:block;
  }

  .type{
    margin-bottom:8px;
  }

  input{
    width:100%;
    margin-bottom:8px;
  }

  .fetch{
    width:100%;
  }

  .grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));

    gap:6px;
  }


  /* Preview */

  .preview{
    padding:40px 35px;
  }

  .imageBox{
    width:100%;
    height:100%;
  }

  .imageBox img{
    width:100%;
    height:100%;
    object-fit:contain;
  }

  .prev{
    left:5px;
  }

  .next{
    right:5px;
  }

  .close{
    top:8px;
    right:8px;
  }

}


/* Very small phones */

@media(max-width:380px){

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}
</style>
</head>


<body>

<div class="wrap">

  <h2>Photo Viewer</h2>

  <div class="controls">

    <!-- CATEGORY -->

    <div class="type">

      <button
        id="student"
        class="active"
        onclick="setType('Student')">
        Student
      </button>

      <button
        id="employee"
        onclick="setType('Employee')">
        Employee
      </button>

    </div>


    <!-- MASTER IDS -->

    <input
      id="ids"
      type="text"
      placeholder="IDs: 2,5,7-12"
      autocomplete="off">


    <!-- FETCH -->

    <button
      class="fetch"
      onclick="fetchPhotos()">
      Fetch
    </button>

  </div>


  <!-- STATUS -->

  <div id="status" class="status"></div>


  <!-- PHOTOS -->

  <div id="grid" class="grid"></div>

</div>


<!-- =================================
     FULLSCREEN PREVIEW
================================= -->

<div id="preview" class="preview">

  <!-- CLOSE -->

  <button
    class="close"
    onclick="closePreview()">
    ×
  </button>


  <!-- PREVIOUS -->

  <button
    class="nav prev"
    onclick="previous()">
    ‹
  </button>


  <!-- IMAGE -->

  <div class="imageBox">

    <img
      id="previewImg"
      draggable="false">

  </div>


  <!-- NEXT -->

  <button
    class="nav next"
    onclick="next()">
    ›
  </button>


  <!-- COUNT -->

  <div
    id="count"
    class="count">
  </div>

</div>


<script>

/* =================================
   VARIABLES
================================= */

let type = "Student";

let photos = [];

let current = 0;

let touchStartX = 0;
let touchStartY = 0;


/* =================================
   CATEGORY
================================= */

function setType(value){

  type = value;

  document
    .getElementById("student")
    .classList.toggle(
      "active",
      value === "Student"
    );

  document
    .getElementById("employee")
    .classList.toggle(
      "active",
      value === "Employee"
    );
}


/* =================================
   PARSE MASTER IDS
================================= */

function parseIds(value){

  const result = [];

  value
    .split(",")
    .forEach(part => {

      part = part.trim();

      if(!part) return;


      /* RANGE */

      if(part.includes("-")){

        let [a,b] =
          part
            .split("-")
            .map(Number);


        if(
          !isNaN(a) &&
          !isNaN(b)
        ){

          if(a > b){
            [a,b] = [b,a];
          }


          for(
            let i = a;
            i <= b;
            i++
          ){

            result.push(i);

          }

        }

      }


      /* SINGLE ID */

      else{

        const id =
          Number(part);

        if(!isNaN(id)){
          result.push(id);
        }

      }

    });


  /* Remove duplicates */

  return [...new Set(result)];
}


/* =================================
   FETCH PHOTOS
================================= */

function fetchPhotos(){

  const ids =
    parseIds(
      document
        .getElementById("ids")
        .value
    );


  const grid =
    document
      .getElementById("grid");


  const status =
    document
      .getElementById("status");


  /* RESET */

  grid.innerHTML = "";

  photos = [];

  current = 0;


  if(!ids.length){

    status.textContent =
      "Enter Master IDs.";

    return;
  }


  status.textContent =
    `Loading 0 / ${ids.length}`;


  let loaded = 0;


  /* =================================
     LOAD EACH PHOTO INDEPENDENTLY

     Jo photo pehle load hogi,
     woh turant screen par aayegi.
  ================================= */

  ids.forEach(id => {


    const url =
      "https://glb.servergi.com:8071/iSIMGLBMTR/Services/getImage.ashx" +

      "?Category=" +
      encodeURIComponent(type) +

      "&MasterId=" +
      encodeURIComponent(id) +

      "&ImageRefName=Photo" +

      "&IdCode=" +

      "&height=120" +

      "&width=100";


    const testImg =
      new Image();


    /* SUCCESS */

    testImg.onload =
      function(){


        if(
          testImg.naturalWidth > 1 &&
          testImg.naturalHeight > 1
        ){


          const index =
            photos.length;


          /* Store photo */

          photos.push({
            id:id,
            url:url
          });


          /* Create card */

          const card =
            document
              .createElement("div");


          card.className =
            "photo";


          /* Thumbnail */

          const img =
            document
              .createElement("img");


          img.src = url;

          img.loading = "lazy";

          img.alt =
            "Photo " + id;


          card.appendChild(img);


          /* Preview click */

          card.onclick =
            function(){

              openPreview(index);

            };


          /* IMPORTANT:
             Photo immediately appears */

          grid.appendChild(card);

        }


        loaded++;


        status.textContent =
          `Loading ${loaded} / ${ids.length} • ` +
          `${photos.length} found`;

      };


    /* FAILED / NO PHOTO */

    testImg.onerror =
      function(){

        loaded++;


        status.textContent =
          `Loading ${loaded} / ${ids.length} • ` +
          `${photos.length} found`;

      };


    /* Start loading */

    testImg.src = url;

  });

}


/* =================================
   OPEN PREVIEW
================================= */

function openPreview(index){

  current = index;


  document
    .getElementById("preview")
    .classList.add("show");


  updatePreview();

}


/* =================================
   UPDATE PREVIEW
================================= */

function updatePreview(){

  if(!photos.length)
    return;


  const img =
    document
      .getElementById("previewImg");


  img.src =
    photos[current].url;


  document
    .getElementById("count")
    .textContent =
      `${current + 1} / ${photos.length}`;

}


/* =================================
   CLOSE
================================= */

function closePreview(){

  document
    .getElementById("preview")
    .classList
    .remove("show");

}


/* =================================
   NEXT
================================= */

function next(){

  if(!photos.length)
    return;


  current =
    (current + 1)
    % photos.length;


  updatePreview();

}


/* =================================
   PREVIOUS
================================= */

function previous(){

  if(!photos.length)
    return;


  current =
    (current - 1 + photos.length)
    % photos.length;


  updatePreview();

}


/* =================================
   KEYBOARD NAVIGATION
================================= */

document.addEventListener(
  "keydown",
  function(e){

    const preview =
      document
        .getElementById("preview");


    if(
      !preview
        .classList
        .contains("show")
    ){
      return;
    }


    if(e.key === "ArrowRight"){
      next();
    }


    if(e.key === "ArrowLeft"){
      previous();
    }


    if(e.key === "Escape"){
      closePreview();
    }

  }
);


/* =================================
   MOBILE SWIPE
================================= */

const preview =
  document
    .getElementById("preview");


preview.addEventListener(
  "touchstart",
  function(e){

    touchStartX =
      e.changedTouches[0]
        .screenX;

    touchStartY =
      e.changedTouches[0]
        .screenY;

  },
  {
    passive:true
  }
);


preview.addEventListener(
  "touchend",
  function(e){

    const endX =
      e.changedTouches[0]
        .screenX;

    const endY =
      e.changedTouches[0]
        .screenY;


    const diffX =
      endX - touchStartX;

    const diffY =
      endY - touchStartY;


    /*
      Only horizontal swipe
    */

    if(
      Math.abs(diffX) < 50 ||
      Math.abs(diffX) < Math.abs(diffY)
    ){
      return;
    }


    if(diffX < 0){
      next();
    }
    else{
      previous();
    }

  },
  {
    passive:true
  }
);


/* =================================
   CLICK BACKGROUND TO CLOSE
================================= */

preview.addEventListener(
  "click",
  function(e){

    if(e.target === preview){
      closePreview();
    }

  }
);

</script>

</body>
</html>
<script>
let n = 0;
const out = document.getElementById("out");
document.getElementById("btn").addEventListener("click", () => {
  n++;
  out.textContent = `Clicked ${n} time${n === 1 ? "" : "s"}`;
  console.log("click", n);
});
console.log("Playground ready ✅");
</script>
</body>
</html>
