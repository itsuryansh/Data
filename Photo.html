<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Photo Viewer</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			-webkit-tap-highlight-color: transparent;
		}
		
		:root {
			--bg: #0b1120;
			--surface: #151e32;
			--surface-soft: #1e293b;
			--border: #2a354e;
			--border-dark: #334155;
			--text: #f8fafc;
			--text-soft: #94a3b8;
			--text-muted: #64748b;
			--primary: #3b82f6;
			--primary-soft: rgba(59, 130, 246, 0.15);
			--danger: #ef4444;
			--radius: 12px;
		}
		
		html, body {
			height: 100dvh;
			height: 100vh;
			overflow: hidden;
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		.app {
			height: 100%;
			max-width: 900px;
			margin: 0 auto;
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 16px;
		}

		.header-card {
			flex-shrink: 0;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 16px 20px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
		}
		
		.brand { display: flex; align-items: center; gap: 12px; }
		.brand-icon {
			width: 40px; height: 40px; display: grid; place-items: center;
			border-radius: 8px; background: var(--primary-soft); color: var(--primary);
		}
		.brand-icon svg { width: 22px; height: 22px; }
		.brand-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
		.brand-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

		.controls {
			flex-shrink: 0;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.tabs {
			display: flex;
			gap: 4px;
			background: var(--bg);
			padding: 4px;
			border-radius: 8px;
		}
		.tab {
			flex: 1;
			height: 36px;
			display: flex;
			align-items: center;
			justify-content: center;
			border: none;
			background: transparent;
			color: var(--text-muted);
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			border-radius: 6px;
			transition: all 0.2s;
		}
		.tab.active {
			background: var(--primary);
			color: white;
			box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
		}
		.tab:not(.active):hover {
			color: var(--text);
			background: var(--surface-soft);
		}

		.input-row {
			display: flex;
			gap: 8px;
			align-items: center;
		}
		.master-input {
			flex: 1;
			height: 40px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: var(--surface-soft);
			color: var(--text);
			padding: 0 14px;
			font-size: 14px;
			outline: none;
			transition: all 0.2s;
		}
		.master-input:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 3px var(--primary-soft);
		}
		.master-input::placeholder { color: var(--text-muted); }

		.fetch-btn {
			height: 40px;
			padding: 0 20px;
			border: none;
			border-radius: 8px;
			background: var(--primary);
			color: white;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 6px;
			transition: all 0.2s;
			white-space: nowrap;
		}
		.fetch-btn:hover { background: #2563eb; transform: translateY(-1px); }
		.fetch-btn:active { transform: translateY(0); }
		.fetch-btn svg { width: 16px; height: 16px; }

		.viewer-card {
			flex: 1;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			position: relative;
			min-height: 0;
		}

		.viewer-header {
			flex-shrink: 0;
			height: 48px;
			padding: 0 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid var(--border);
			background: var(--surface);
		}
		.viewer-title {
			font-size: 13px;
			font-weight: 600;
			color: var(--text-soft);
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.status-dot {
			width: 6px; height: 6px; border-radius: 50%;
			background: var(--text-muted);
		}
		.status-dot.success { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); }
		.status-dot.error { background: var(--danger); box-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }

		.viewer-body {
			flex: 1;
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			background: radial-gradient(circle at center, #1a2338 0%, #0b1120 100%);
		}

		.photo-container {
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.photo-img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
			border-radius: 8px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
			opacity: 0;
			transition: opacity 0.3s ease;
		}
		.photo-img.loaded { opacity: 1; }

		.empty-state {
			text-align: center;
			color: var(--text-muted);
			padding: 20px;
		}
		.empty-state svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 12px; }
		.empty-title { font-size: 15px; font-weight: 600; color: var(--text-soft); margin-bottom: 4px; }
		.empty-desc { font-size: 12px; }

		.loader {
			width: 40px; height: 40px;
			border: 3px solid var(--border);
			border-top-color: var(--primary);
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }

		.nav-btn {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			width: 44px; height: 44px;
			border-radius: 50%;
			border: 1px solid var(--border);
			background: rgba(21, 30, 50, 0.9);
			backdrop-filter: blur(8px);
			color: var(--text);
			display: grid;
			place-items: center;
			cursor: pointer;
			transition: all 0.2s;
			z-index: 5;
		}
		.nav-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); }
		.nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
		.nav-btn svg { width: 20px; height: 20px; }
		.nav-btn.prev { left: 16px; }
		.nav-btn.next { right: 16px; }

		.viewer-footer {
			flex-shrink: 0;
			height: 44px;
			padding: 0 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			border-top: 1px solid var(--border);
			color: var(--text-muted);
			font-size: 11px;
		}
		kbd {
			display: inline-flex; align-items: center; justify-content: center;
			min-width: 20px; height: 18px; padding: 0 5px;
			border: 1px solid var(--border); border-bottom-width: 2px;
			border-radius: 4px; background: var(--surface-soft);
			color: var(--text-soft); font-size: 10px; font-weight: 700;
		}

		.history-pills {
			display: flex;
			gap: 6px;
			flex-wrap: wrap;
			padding: 0 4px;
		}
		.pill {
			height: 26px;
			padding: 0 10px;
			border-radius: 13px;
			background: var(--surface-soft);
			color: var(--text-soft);
			font-size: 11px;
			font-weight: 600;
			display: flex;
			align-items: center;
			gap: 4px;
			cursor: pointer;
			border: 1px solid transparent;
			transition: all 0.2s;
		}
		.pill:hover { border-color: var(--border); color: var(--text); }
		.pill .close {
			width: 14px; height: 14px;
			display: grid; place-items: center;
			border-radius: 50%;
			background: var(--border);
			font-size: 10px;
		}
		.pill .close:hover { background: var(--danger); color: white; }

		@media (max-width: 600px) {
			.app { padding: 10px; gap: 10px; }
			.header-card { padding: 12px 16px; }
			.brand-subtitle { display: none; }
			.controls { padding: 12px; }
			.nav-btn { width: 38px; height: 38px; }
			.nav-btn.prev { left: 8px; }
			.nav-btn.next { right: 8px; }
			.viewer-footer { font-size: 10px; }
		}
	</style>
</head>
<body>
	<div class="app">
		<section class="header-card">
			<div class="brand">
				<div class="brand-icon">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
						<rect x="3" y="3" width="18" height="18" rx="2" />
						<circle cx="8.5" cy="8.5" r="1.5" />
						<path d="m21 15-5-5L5 21" />
					</svg>
				</div>
				<div>
					<div class="brand-title">Photo Viewer</div>
					<div class="brand-subtitle">Fetch & view student/employee photos</div>
				</div>
			</div>
		</section>

		<section class="controls">
			<div class="tabs">
				<button class="tab active" data-category="Student">Student</button>
				<button class="tab" data-category="Employee">Employee</button>
			</div>
			<div class="input-row">
				<input type="text" class="master-input" id="masterInput" placeholder="Enter Master ID (e.g., 4264)" autocomplete="off">
				<button class="fetch-btn" id="fetchBtn">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="11" cy="11" r="8" />
						<path d="m21 21-4.3-4.3" />
					</svg>
					Fetch
				</button>
			</div>
			<div class="history-pills" id="historyPills"></div>
		</section>

		<section class="viewer-card">
			<div class="viewer-header">
				<div class="viewer-title">
					<span class="status-dot" id="statusDot"></span>
					<span id="statusText">Ready</span>
				</div>
				<div style="font-size: 11px; color: var(--text-muted);" id="categoryLabel">Student</div>
			</div>
			
			<div class="viewer-body">
				<button class="nav-btn prev" id="prevBtn" disabled title="Previous">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
				</button>

				<div class="photo-container" id="photoContainer">
					<div class="empty-state" id="emptyState">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<circle cx="8.5" cy="8.5" r="1.5" />
							<path d="m21 15-5-5L5 21" />
						</svg>
						<div class="empty-title">No photo loaded</div>
						<div class="empty-desc">Enter a Master ID and click Fetch</div>
					</div>
					<img class="photo-img" id="photoImg" style="display:none;" alt="Photo">
					<div class="loader" id="loader" style="display:none;"></div>
				</div>

				<button class="nav-btn next" id="nextBtn" disabled title="Next">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
				</button>
			</div>

			<div class="viewer-footer">
				<kbd>←</kbd> Prev &nbsp; <kbd>→</kbd> Next &nbsp; <kbd>Enter</kbd> Fetch
			</div>
		</section>
	</div>

	<script>
		const PHOTO_BASE_URL = "https://glb.servergi.com:8071/OLAGLBMTR/Services/getImage.ashx";
		
		let currentCategory = "Student";
		let history = [];
		let currentIndex = -1;

		const masterInput = document.getElementById("masterInput");
		const fetchBtn = document.getElementById("fetchBtn");
		const photoImg = document.getElementById("photoImg");
		const emptyState = document.getElementById("emptyState");
		const loader = document.getElementById("loader");
		const statusDot = document.getElementById("statusDot");
		const statusText = document.getElementById("statusText");
		const categoryLabel = document.getElementById("categoryLabel");
		const prevBtn = document.getElementById("prevBtn");
		const nextBtn = document.getElementById("nextBtn");
		const historyPills = document.getElementById("historyPills");

		function normalizeId(value) {
			if (!value) return "";
			let result = String(value).trim();
			if (result.endsWith(".0")) result = result.slice(0, -2);
			return result;
		}

		function setStatus(state, text) {
			statusDot.className = "status-dot " + state;
			statusText.textContent = text;
		}

		function updateNavButtons() {
			prevBtn.disabled = history.length <= 1 || currentIndex <= 0;
			nextBtn.disabled = history.length <= 1 || currentIndex >= history.length - 1;
		}

		function renderHistory() {
			historyPills.innerHTML = "";
			history.forEach((item, idx) => {
				const pill = document.createElement("div");
				pill.className = "pill";
				pill.innerHTML = `
					<span>${item.category.charAt(0)}-${item.id}</span>
					<span class="close">×</span>
				`;
				pill.querySelector("span:first-child").addEventListener("click", () => {
					currentIndex = idx;
					loadPhoto(history[idx]);
					updateNavButtons();
				});
				pill.querySelector(".close").addEventListener("click", (e) => {
					e.stopPropagation();
					history.splice(idx, 1);
					if (currentIndex >= history.length) currentIndex = history.length - 1;
					if (history.length === 0) {
						showEmpty();
						setStatus("", "Ready");
					} else {
						loadPhoto(history[currentIndex]);
					}
					renderHistory();
					updateNavButtons();
				});
				historyPills.appendChild(pill);
			});
		}

		function showEmpty() {
			photoImg.style.display = "none";
			loader.style.display = "none";
			emptyState.style.display = "block";
		}

		function showLoading() {
			photoImg.style.display = "none";
			emptyState.style.display = "none";
			loader.style.display = "block";
			setStatus("", "Loading...");
		}

		function loadPhoto(item) {
			showLoading();
			categoryLabel.textContent = item.category;
			
			const url = `${PHOTO_BASE_URL}?Category=${item.category}&MasterId=${encodeURIComponent(item.id)}&ImageRefName=Photo`;
			
			photoImg.onload = () => {
				loader.style.display = "none";
				photoImg.style.display = "block";
				setTimeout(() => photoImg.classList.add("loaded"), 10);
				setStatus("success", "Loaded");
			};
			photoImg.onerror = () => {
				loader.style.display = "none";
				showEmpty();
				emptyState.querySelector(".empty-title").textContent = "Photo not found";
				emptyState.querySelector(".empty-desc").textContent = "No photo available for this ID";
				setStatus("error", "Not found");
			};
			
			photoImg.classList.remove("loaded");
			photoImg.src = url;
		}

		function fetchPhoto() {
			const rawId = masterInput.value.trim();
			const id = normalizeId(rawId);
			if (!id) {
				masterInput.focus();
				return;
			}

			const existingIdx = history.findIndex(h => h.id === id && h.category === currentCategory);
			if (existingIdx !== -1) {
				currentIndex = existingIdx;
				loadPhoto(history[currentIndex]);
				updateNavButtons();
				return;
			}

			const item = { id, category: currentCategory };
			history.push(item);
			currentIndex = history.length - 1;
			
			renderHistory();
			loadPhoto(item);
			updateNavButtons();
			masterInput.value = "";
		}

		function navigate(direction) {
			if (history.length === 0) return;
			let newIndex = currentIndex + direction;
			if (newIndex < 0) newIndex = history.length - 1;
			if (newIndex >= history.length) newIndex = 0;
			currentIndex = newIndex;
			loadPhoto(history[currentIndex]);
			updateNavButtons();
		}

		document.querySelectorAll(".tab").forEach(tab => {
			tab.addEventListener("click", () => {
				document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
				tab.classList.add("active");
				currentCategory = tab.dataset.category;
				categoryLabel.textContent = currentCategory;
			});
		});

		fetchBtn.addEventListener("click", fetchPhoto);
		masterInput.addEventListener("keydown", (e) => {
			if (e.key === "Enter") fetchPhoto();
		});

		prevBtn.addEventListener("click", () => navigate(-1));
		nextBtn.addEventListener("click", () => navigate(1));

		document.addEventListener("contextmenu", e => e.preventDefault());

		document.addEventListener("keydown", (e) => {
			if (e.target.tagName === "INPUT") return;
			if (e.key === "ArrowLeft") { e.preventDefault(); navigate(-1); }
			else if (e.key === "ArrowRight") { e.preventDefault(); navigate(1); }
		});

		showEmpty();
	</script>
</body>
</html>
