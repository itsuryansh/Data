<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Student Records</title>
	<style>
		/* =========================================================
       RESET & VARIABLES (PREMIUM DARK)
    ========================================================= */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			-webkit-tap-highlight-color: transparent;
		}
		
		:root {
			--bg: #0b1120;
			--surface: #151e32;
			--surface-soft: #1e293b;
			--border: #2a354e;
			--border-dark: #334155;
			--text: #f8fafc;
			--text-soft: #94a3b8;
			--text-muted: #64748b;
			--primary: #3b82f6;
			--primary-soft: rgba(59, 130, 246, 0.15);
			--male: #60a5fa;
			--female: #f472b6;
			--radius: 10px;
		}
		
		html, body {
			height: 95dvh;
			height: 95vh;
			overflow: hidden;
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
			background: var(--bg);
			color: var(--text);
		}

		/* =========================================================
       APP LAYOUT
    ========================================================= */
		.app {
			height: 100%;
			max-width: 1400px;
			margin: 0 auto;
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		/* =========================================================
       MINIMAL HEADER
    ========================================================= */
		.header-card {
			flex-shrink: 0;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: var(--radius);
			padding: 16px 20px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			flex-wrap: wrap;
		}
		
		.brand { display: flex; align-items: center; gap: 12px; }
		.brand-icon {
			width: 40px; height: 40px; display: grid; place-items: center;
			border-radius: 8px; background: var(--primary-soft); color: var(--primary);
		}
		.brand-icon svg { width: 22px; height: 22px; }
		.brand-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
		.brand-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
		
		.stats { display: flex; gap: 16px; }
		.stat { text-align: right; }
		.stat-value { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1; }
		.stat-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-top: 4px; }

		/* =========================================================
       TOOLBAR
    ========================================================= */
		.toolbar {
			flex-shrink: 0;
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}
		
		.search-wrap { position: relative; flex: 1 1 250px; min-width: 200px; }
		.search-icon {
			position: absolute; left: 12px; top: 50%; width: 16px; height: 16px;
			transform: translateY(-50%); color: var(--text-muted); pointer-events: none;
		}
		
		.search-input, .select-control {
			height: 38px; border: 1px solid var(--border); border-radius: 8px;
			background: var(--surface-soft); color: var(--text); outline: none;
			font-size: 13px; transition: all 0.2s;
		}
		.search-input { width: 100%; padding: 0 12px 0 36px; }
		.select-control { padding: 0 10px; cursor: pointer; min-width: 110px; }
		.search-input:focus, .select-control:focus {
			border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft);
		}
		
		/* FIXED CHECKBOX CSS */
		.photo-check {
			height: 38px; display: inline-flex; align-items: center; gap: 8px;
			padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
			background: var(--surface-soft); color: var(--text-soft);
			font-size: 12px; font-weight: 500; cursor: pointer; user-select: none;
		}
		.photo-check input {
			appearance: none; -webkit-appearance: none;
			width: 18px; height: 18px; border: 2px solid var(--border-dark);
			border-radius: 4px; background: var(--bg); cursor: pointer;
			position: relative; transition: all 0.2s; flex-shrink: 0;
		}
		.photo-check input:checked {
			background: var(--primary); border-color: var(--primary);
		}
		.photo-check input:checked::after {
			content: ""; position: absolute; left: 5px; top: 1px;
			width: 5px; height: 10px; border: solid white;
			border-width: 0 2px 2px 0; transform: rotate(45deg);
		}
		
		.clear-button {
			height: 38px; display: inline-flex; align-items: center; justify-content: center;
			border: 1px solid var(--border); border-radius: 8px; background: transparent;
			color: var(--text-soft); padding: 0 12px; cursor: pointer; transition: all 0.2s;
		}
		.clear-button:hover { background: var(--surface-soft); color: var(--text); }
		.clear-button svg { width: 15px; height: 15px; }

		/* =========================================================
       TABLE CARD & PREMIUM SCROLLBAR
    ========================================================= */
		.table-card {
			flex: 1; display: flex; flex-direction: column;
			background: var(--surface); border: 1px solid var(--border);
			border-radius: var(--radius); overflow: hidden;
		}
		
		.table-toolbar {
			flex-shrink: 0; height: 44px; display: flex; align-items: center;
			justify-content: space-between; padding: 0 16px;
			border-bottom: 1px solid var(--border); background: var(--surface);
		}
		.results { display: flex; align-items: center; gap: 8px; color: var(--text-soft); font-size: 12px; font-weight: 600; }
		.results-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); }
		
		.table-wrapper { flex: 1; overflow: auto; position: relative; }
		.table-wrapper::-webkit-scrollbar { width: 6px; height: 6px; }
		.table-wrapper::-webkit-scrollbar-track { background: transparent; }
		.table-wrapper::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 10px; }
		.table-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
		.table-wrapper { scrollbar-width: thin; scrollbar-color: var(--border-dark) transparent; }

		table { width: 100%; min-width: 700px; border-collapse: separate; border-spacing: 0; }
		th, td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 12px 16px; font-size: 13px; white-space: nowrap; }
		th:last-child, td:last-child { border-right: none; }
		
		th {
			position: sticky; top: 0; z-index: 10; background: rgba(21, 30, 50, 0.95);
			backdrop-filter: blur(8px); color: var(--text-muted); font-size: 11px;
			font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
		}

		th.sortable { cursor: pointer; user-select: none; transition: background 0.2s, color 0.2s; }
		th.sortable:hover { background: var(--surface-soft); color: var(--text); }
		th.sortable::after { content: '↕'; font-size: 10px; margin-left: 6px; opacity: 0.3; transition: opacity 0.2s; }
		th.sortable.asc::after { content: '↑'; opacity: 1; color: var(--primary); }
		th.sortable.desc::after { content: '↓'; opacity: 1; color: var(--primary); }
		
		tbody tr { cursor: pointer; transition: background 0.15s; }
		tbody tr:hover { background: var(--surface-soft); }
		
		.center { text-align: center; }
		.gender-male { color: var(--male); font-weight: 600; }
		.gender-female { color: var(--female); font-weight: 600; }
		.student-name { font-weight: 600; color: var(--text); }
		.student-number, .mobile-number { font-variant-numeric: tabular-nums; color: var(--text-soft); }
		
		.empty-state { display: none; text-align: center; padding: 60px 20px; color: var(--text-muted); }

		/* =========================================================
       LOADING SPINNER
    ========================================================= */
		.loader-container {
			display: none; flex-direction: column; align-items: center;
			justify-content: center; height: 100%; color: var(--text-muted); font-size: 13px;
		}
		.spinner {
			width: 32px; height: 32px; border: 3px solid var(--border);
			border-top-color: var(--primary); border-radius: 50%;
			animation: spin 0.8s linear infinite; margin-bottom: 12px;
		}
		@keyframes spin { to { transform: rotate(360deg); } }

		/* =========================================================
       MODAL
    ========================================================= */
		.modal-backdrop {
			position: fixed; inset: 0; display: none; align-items: center;
			justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.75);
			backdrop-filter: blur(4px); z-index: 1000; opacity: 0; transition: opacity 0.2s ease;
		}
		.modal-backdrop.show { display: flex; opacity: 1; }
		
		.detail-modal {
			width: min(800px, 100%); max-height: 90dvh; background: var(--surface);
			border: 1px solid var(--border); border-radius: 14px;
			box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
			display: flex; flex-direction: column;
			transform: translateY(10px) scale(0.98);
			transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
		}
		.modal-backdrop.show .detail-modal { transform: translateY(0) scale(1); }
		
		.modal-header {
			flex-shrink: 0; height: 56px; display: flex; align-items: center;
			justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border);
		}
		.modal-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.modal-position { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
		
		.modal-buttons { display: flex; gap: 6px; }
		.icon-button {
			width: 32px; height: 32px; display: grid; place-items: center;
			border: 1px solid var(--border); border-radius: 6px;
			background: var(--surface-soft); color: var(--text);
			cursor: pointer; transition: all 0.2s;
		}
		.icon-button:hover:not(:disabled) { background: var(--border); }
		.icon-button:disabled { opacity: 0.3; cursor: not-allowed; }
		.icon-button svg { width: 16px; height: 16px; }
		
		.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
		.modal-body::-webkit-scrollbar { width: 5px; }
		.modal-body::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 10px; }

		.profile-top { display: grid; grid-template-columns: 130px 1fr; gap: 20px; margin-bottom: 20px; align-items: start; }
		.photo-card {
			width: 130px; height: 160px; border: 1px solid var(--border);
			border-radius: 10px; background: var(--surface-soft);
			display: grid; place-items: center; overflow: hidden;
		}
		.student-photo { width: 100%; height: 100%; object-fit: cover; }
		.photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-muted); font-size: 11px; text-align: center; }
		.photo-placeholder svg { width: 28px; height: 28px; opacity: 0.4; }
		
		.basic-grid, .all-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
		.full-width { grid-column: 1 / -1; }
		
		.detail-card { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
		.detail-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 4px; }
		.detail-value { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-word; line-height: 1.4; }
		
		.modal-footer {
			flex-shrink: 0; margin-top: 16px; padding-top: 12px;
			border-top: 1px solid var(--border); text-align: center;
			color: var(--text-muted); font-size: 11px;
		}
		kbd {
			display: inline-flex; align-items: center; justify-content: center;
			min-width: 20px; height: 18px; padding: 0 5px;
			border: 1px solid var(--border); border-bottom-width: 2px;
			border-radius: 4px; background: var(--surface-soft);
			color: var(--text-soft); font-size: 10px; font-weight: 700;
		}

		/* =========================================================
       RESPONSIVE
    ========================================================= */
		@media (max-width: 768px) {
			.app { padding: 10px; gap: 10px; }
			.header-card { padding: 12px 16px; flex-direction: column; align-items: flex-start; }
			.brand-subtitle { display: none; }
			.stats { width: 100%; justify-content: space-between; margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
			.stat { text-align: center; }
			
			.toolbar { gap: 8px; }
			.search-wrap { min-width: 100%; order: -1; }
			.select-control, .photo-check, .clear-button { flex: 1; justify-content: center; font-size: 12px; }
			
			.profile-top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
			.photo-card { width: 120px; height: 150px; }
			.basic-grid, .all-details { grid-template-columns: 1fr; }
			
			.modal-backdrop { padding: 0; align-items: flex-end; }
			.detail-modal { width: 100%; max-height: 95dvh; border-radius: 16px 16px 0 0; border-bottom: none; }
		}
	</style>
</head>
<body>
	<div class="app">
		<section class="header-card">
			<div class="brand">
				<div class="brand-icon">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
						<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
						<circle cx="9" cy="7" r="4" />
						<path d="M22 21v-2a4 4 0 0 0-3-3.87" />
						<path d="M16 3.13a4 4 0 0 1 0 7.75" />
					</svg>
				</div>
				<div>
					<div class="brand-title">Student Records</div>
					<div class="brand-subtitle">Tap headers to sort • Tap rows for details</div>
				</div>
			</div>
			<div class="stats">
				<div class="stat">
					<div class="stat-value" id="totalCount">0</div>
					<div class="stat-label">Total</div>
				</div>
				<div class="stat">
					<div class="stat-value" id="maleCount" style="color: var(--male)">0</div>
					<div class="stat-label">Male</div>
				</div>
				<div class="stat">
					<div class="stat-value" id="femaleCount" style="color: var(--female)">0</div>
					<div class="stat-label">Female</div>
				</div>
			</div>
		</section>

		<section class="toolbar">
			<div class="search-wrap">
				<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
				</svg>
				<input id="searchInput" class="search-input" type="text" placeholder="Search name, number, mobile..." autocomplete="off">
			</div>
			<select id="genderFilter" class="select-control">
				<option value="">All Gender</option>
				<option value="Male">Male</option>
				<option value="Female">Female</option>
			</select>
			<label class="photo-check">
				<input type="checkbox" id="photoOnly">
				<span>With Photo</span>
			</label>
			<button class="clear-button" id="clearBtn" type="button" title="Clear Filters">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" />
				</svg>
			</button>
		</section>

		<section class="table-card">
			<div class="table-toolbar">
				<div class="results">
					<span class="results-dot"></span>
					<span id="resultInfo">Loading...</span>
				</div>
			</div>
			
			<div id="loader" class="loader-container">
				<div class="spinner"></div>
				<div>Fetching Data.json...</div>
			</div>

			<div class="table-wrapper" id="tableWrapper" style="display: none;">
				<table>
					<thead>
						<tr>
							<th class="center sortable" data-sort="Student Number">Student Number</th>
							<th class="sortable" data-sort="Name">Name</th>
							<th class="center sortable" data-sort="DOB">DOB</th>
							<th class="center sortable" data-sort="Gender">Gender</th>
							<th class="sortable" data-sort="Mobile">Mobile</th>
						</tr>
					</thead>
					<tbody id="studentTable"></tbody>
				</table>
			</div>
			<div class="empty-state" id="emptyState">
				<div style="font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px;">No records found</div>
				<div style="font-size: 12px;">Try adjusting your search or filters.</div>
			</div>
		</section>
	</div>

	<!-- DETAIL MODAL -->
	<div class="modal-backdrop" id="modalBackdrop">
		<div class="detail-modal">
			<div class="modal-header">
				<div style="min-width: 0; flex: 1;">
					<div class="modal-title" id="popupHeading">Student Details</div>
					<div class="modal-position" id="popupPosition">0 / 0</div>
				</div>
				<div class="modal-buttons">
					<button class="icon-button" id="prevBtn" title="Previous">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
					</button>
					<button class="icon-button" id="nextBtn" title="Next">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
					</button>
					<button class="icon-button" id="closeBtn" title="Close">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
					</button>
				</div>
			</div>
			<div class="modal-body">
				<div class="profile-top">
					<div class="photo-card">
						<img id="studentPhoto" class="student-photo" style="display:none;" alt="Student Photo">
						<div class="photo-placeholder" id="photoPlaceholder">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
								<rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" />
							</svg>
							<span>No Photo</span>
						</div>
					</div>
					<div class="basic-grid" id="basicInfo"></div>
				</div>
				<div class="all-details" id="allDetails"></div>
				<div class="modal-footer">
					<kbd>←</kbd> Prev &nbsp; <kbd>→</kbd> Next &nbsp; <kbd>Esc</kbd> Close
				</div>
			</div>
		</div>
	</div>

	<script>
		let STUDENTS = [];
		let filteredStudents = [];
		let currentPosition = -1;
		
		// DEFAULT SORT: Name, Ascending
		let currentSortField = "Name";
		let currentSortOrder = "asc";

		// DOM Elements
		const searchInput = document.getElementById("searchInput");
		const genderFilter = document.getElementById("genderFilter");
		const photoOnly = document.getElementById("photoOnly");
		const clearBtn = document.getElementById("clearBtn");
		const tableBody = document.getElementById("studentTable");
		const emptyState = document.getElementById("emptyState");
		const resultInfo = document.getElementById("resultInfo");
		const loader = document.getElementById("loader");
		const tableWrapper = document.getElementById("tableWrapper");
		
		const totalCount = document.getElementById("totalCount");
		const maleCount = document.getElementById("maleCount");
		const femaleCount = document.getElementById("femaleCount");
		
		const modalBackdrop = document.getElementById("modalBackdrop");
		const popupHeading = document.getElementById("popupHeading");
		const popupPosition = document.getElementById("popupPosition");
		const basicInfo = document.getElementById("basicInfo");
		const allDetails = document.getElementById("allDetails");
		const studentPhoto = document.getElementById("studentPhoto");
		const photoPlaceholder = document.getElementById("photoPlaceholder");
		const prevBtn = document.getElementById("prevBtn");
		const nextBtn = document.getElementById("nextBtn");
		const closeBtn = document.getElementById("closeBtn");
		
		const PHOTO_BASE_URL = "https://glb.servergi.com:8071/OLAGLBMTR/Services/getImage.ashx";

		/* =========================================================
		   FETCH DATA
		========================================================= */
		async function loadData() {
			try {
				const response = await fetch('Data.json');
				if (!response.ok) throw new Error(`HTTP ${response.status}`);
				STUDENTS = await response.json();
				
				loader.style.display = 'none';
				tableWrapper.style.display = 'block';
				
				updateStats();
				updateSortHeaders(); // Set default sort UI indicator
				applyFilters();
			} catch (error) {
				console.error("Error loading Data.json:", error);
				loader.innerHTML = `<div style="color: #ef4444; text-align: center;">
					<strong>Failed to load Data.json</strong><br>
					<small>Ensure the file exists in the same folder.</small><br>
					<small style="opacity: 0.7; margin-top: 8px; display: block;">${error.message}</small>
				</div>`;
				loader.style.display = 'flex';
			}
		}

		function updateStats() {
			const male = STUDENTS.filter(s => String(s["Gender"] || "").trim().toLowerCase() === "male").length;
			const female = STUDENTS.filter(s => String(s["Gender"] || "").trim().toLowerCase() === "female").length;
			totalCount.textContent = STUDENTS.length.toLocaleString();
			maleCount.textContent = male.toLocaleString();
			femaleCount.textContent = female.toLocaleString();
		}

		function normalizeMasterId(value) {
			if (value === null || value === undefined) return "";
			let result = String(value).trim();
			if (result.endsWith(".0")) result = result.slice(0, -2);
			return result;
		}

		function getPhotoUrl(masterId) {
			const id = normalizeMasterId(masterId);
			return id ? `${PHOTO_BASE_URL}?Category=Student&MasterId=${encodeURIComponent(id)}&ImageRefName=Photo` : "";
		}

		// USED ONLY FOR THE "WITH PHOTO" CHECKBOX FILTER
		function hasPhoto(student) {
			return String(student["Photo"] || "").trim().toUpperCase() === "T";
		}

		/* =========================================================
		   FILTER & SORT LOGIC
		========================================================= */
		function applyFilters() {
			const search = searchInput.value.trim().toLowerCase();
			const gender = genderFilter.value.trim().toLowerCase();
			const onlyPhoto = photoOnly.checked;

			filteredStudents = STUDENTS.filter(student => {
				const studentGender = String(student["Gender"] || "").trim().toLowerCase();
				if (gender && studentGender !== gender) return false;
				
				// Filter strictly based on "Photo": "T"
				if (onlyPhoto && !hasPhoto(student)) return false;
				
				if (!search) return true;

				const fields = ["Student Number", "Name", "Mobile", "DOB", "Gender", "Father Name", "Mother Name"];
				return fields.some(field => String(student[field] || "").toLowerCase().includes(search));
			});

			sortData();
			renderTable();
		}

		function sortData() {
			const field = currentSortField;
			const order = currentSortOrder;
			filteredStudents.sort((a, b) => {
				let A = a[field], B = b[field];
				if (field === "Student Number" || field === "Mobile") {
					A = Number(String(A).replace(/\D/g, '')) || 0;
					B = Number(String(B).replace(/\D/g, '')) || 0;
				} else {
					A = String(A || "").toLowerCase();
					B = String(B || "").toLowerCase();
				}
				if (A < B) return order === "asc" ? -1 : 1;
				if (A > B) return order === "asc" ? 1 : -1;
				return 0;
			});
		}

		function handleHeaderSort(field) {
			if (currentSortField === field) {
				currentSortOrder = currentSortOrder === "asc" ? "desc" : "asc";
			} else {
				currentSortField = field;
				currentSortOrder = "asc";
			}
			updateSortHeaders();
			sortData();
			renderTable();
		}

		function updateSortHeaders() {
			document.querySelectorAll('th.sortable').forEach(th => {
				th.classList.remove('asc', 'desc');
				if (th.dataset.sort === currentSortField) {
					th.classList.add(currentSortOrder);
				}
			});
		}

		/* =========================================================
		   RENDER TABLE
		========================================================= */
		function renderTable() {
			tableBody.innerHTML = "";
			if (filteredStudents.length === 0) {
				emptyState.style.display = "block";
				resultInfo.textContent = "0 records";
				return;
			}
			emptyState.style.display = "none";
			const fragment = document.createDocumentFragment();

			filteredStudents.forEach((student, position) => {
				const row = document.createElement("tr");
				const gender = String(student["Gender"] || "").toLowerCase();
				
				row.innerHTML = `
					<td class="center student-number">${escapeHtml(student["Student Number"])}</td>
					<td class="student-name">${escapeHtml(student["Name"])}</td>
					<td class="center">${escapeHtml(student["DOB"])}</td>
					<td class="center ${gender === "male" ? "gender-male" : "gender-female"}">${escapeHtml(student["Gender"])}</td>
					<td class="mobile-number">${escapeHtml(student["Mobile"])}</td>
				`;
				
				row.addEventListener("click", () => { currentPosition = position; openDetails(); });
				row.addEventListener("contextmenu", event => {
					event.preventDefault();
					currentPosition = position;
					openDetails();
				});
				fragment.appendChild(row);
			});
			
			tableBody.appendChild(fragment);
			resultInfo.textContent = `${filteredStudents.length.toLocaleString()} records`;
		}

		/* =========================================================
		   MODAL LOGIC
		========================================================= */
		function openDetails() {
			const student = filteredStudents[currentPosition];
			if (!student) return;
			modalBackdrop.classList.add("show");
			document.body.style.overflow = "hidden";
			renderDetails(student);
		}

		function renderDetails(student) {
			popupHeading.textContent = student["Name"] || "Student Details";
			popupPosition.textContent = `${currentPosition + 1} / ${filteredStudents.length}`;

			// FIXED: ALWAYS attempt to fetch photo if Master ID exists, 
			// regardless of the "Photo": "T" flag.
			if (student["Master ID"]) {
				const masterId = normalizeMasterId(student["Master ID"]);
				const photoUrl = getPhotoUrl(masterId);
				
				studentPhoto.style.display = "none";
				photoPlaceholder.style.display = "flex";
				studentPhoto.src = ""; // Reset to prevent showing old image briefly
				
				studentPhoto.onload = () => { 
					studentPhoto.style.display = "block"; 
					photoPlaceholder.style.display = "none"; 
				};
				studentPhoto.onerror = () => { 
					studentPhoto.style.display = "none"; 
					photoPlaceholder.style.display = "flex"; 
				};
				studentPhoto.src = photoUrl;
			} else {
				// No Master ID at all
				studentPhoto.style.display = "none";
				photoPlaceholder.style.display = "flex";
				studentPhoto.src = "";
			}

			const basicFields = ["Student Number", "Name", "DOB", "Gender", "Mobile", "Email"];
			basicInfo.innerHTML = "";
			basicFields.forEach(field => {
				if(student[field]) basicInfo.appendChild(createCard(field, student[field]));
			});

			allDetails.innerHTML = "";
			Object.entries(student).forEach(([key, value]) => {
				if (basicFields.includes(key) || key === "Master ID" || key === "Photo" || !value) return;
				const card = createCard(key, value);
				if (key === "Address") card.classList.add("full-width");
				allDetails.appendChild(card);
			});
			
			prevBtn.disabled = filteredStudents.length <= 1;
			nextBtn.disabled = filteredStudents.length <= 1;
		}

		function createCard(key, value) {
			const card = document.createElement("div");
			card.className = "detail-card";
			card.innerHTML = `<div class="detail-label">${escapeHtml(key)}</div><div class="detail-value">${escapeHtml(value)}</div>`;
			return card;
		}

		function navigate(direction) {
			if (filteredStudents.length === 0) return;
			let newPosition = currentPosition + direction;
			if (newPosition < 0) newPosition = filteredStudents.length - 1;
			if (newPosition >= filteredStudents.length) newPosition = 0;
			currentPosition = newPosition;
			renderDetails(filteredStudents[currentPosition]);
		}

		function closeModal() {
			modalBackdrop.classList.remove("show");
			document.body.style.overflow = "";
			currentPosition = -1;
		}

		function escapeHtml(value) {
			if (value === null || value === undefined) return "";
			return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
		}

		/* =========================================================
		   EVENT LISTENERS
		========================================================= */
		searchInput.addEventListener("input", applyFilters);
		genderFilter.addEventListener("change", applyFilters);
		photoOnly.addEventListener("change", applyFilters);
		
		clearBtn.addEventListener("click", () => {
			searchInput.value = "";
			genderFilter.value = "";
			photoOnly.checked = false;
			applyFilters();
		});

		document.querySelectorAll('th.sortable').forEach(th => {
			th.addEventListener("click", () => handleHeaderSort(th.dataset.sort));
		});

		prevBtn.addEventListener("click", () => navigate(-1));
		nextBtn.addEventListener("click", () => navigate(1));
		closeBtn.addEventListener("click", closeModal);
		
		modalBackdrop.addEventListener("click", event => {
			if (event.target === modalBackdrop) closeModal();
		});

		document.addEventListener("keydown", event => {
			if (!modalBackdrop.classList.contains("show")) return;
			if (event.key === "ArrowLeft") { event.preventDefault(); navigate(-1); }
			else if (event.key === "ArrowRight") { event.preventDefault(); navigate(1); }
			else if (event.key === "Escape") { event.preventDefault(); closeModal(); }
		});

		// Initialize
		loadData();
	</script>
</body>
</html>
